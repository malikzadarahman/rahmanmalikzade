<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Səhifə tapılmadı — Rəhman Məlikzadə</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#fbfaf8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--murekkeb:#0b0b0c;--kagiz:#fbfaf8;--sus:#86868b;--xett:rgba(11,11,12,.13);--rec:#d93a1e}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;
       background:var(--kagiz);color:var(--murekkeb);
       font:300 16px/1.6 "Poppins",system-ui,sans-serif;padding:32px}
  main{max-width:520px}
  .kod{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--sus);margin-bottom:20px}
  .cizgi{width:52px;height:3px;background:var(--rec);margin-bottom:26px}
  h1{font-weight:200;font-size:clamp(28px,6vw,44px);line-height:1.15;margin:0 0 16px}
  p{color:var(--sus);margin:0 0 34px}
  nav{display:flex;flex-wrap:wrap;gap:10px}
  a{display:inline-block;padding:11px 20px;border-radius:999px;text-decoration:none;
    font-size:14px;border:1px solid var(--xett);color:var(--murekkeb);transition:.25s}
  a:hover{border-color:var(--murekkeb)}
  a.dolu{background:var(--murekkeb);color:var(--kagiz);border-color:var(--murekkeb)}
  a.dolu:hover{opacity:.85}
</style>
</head>
<body>
<main>
  <div class="kod">404</div>
  <div class="cizgi"></div>
  <h1>Bu səhifə tapılmadı</h1>
  <p>Axtardığınız ünvan dəyişmiş və ya silinmiş ola bilər. Aşağıdakı keçidlərdən davam edin.</p>
  <nav>
    <a class="dolu" href="/">Ana səhifə</a>
    <a href="/paket">Paketlər</a>
    <a href="/video-kalkulyator">Video qiyməti</a>
    <a href="/kalkulyator">Foto qiyməti</a>
  </nav>
</main>
</body>
</html>
