<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf8">
<title>Paketlər — payız kampaniyası (nümunə)</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/font.css">
<style>
/* ==========================================================================
   PAKETLƏR — PAYIZ KAMPANİYASI (nümunə)
   Mövcud dizayn dili olduğu kimi saxlanılıb: Poppins + Latino/Boruna,
   krem fon, qara mətn, eyni radius/kölgə/keçid əyriləri.
   Yalnız kampaniya qatı əlavə olunub.
   ========================================================================== */
:root{
  /* --- saytın mövcud tokenləri (index.html ilə eyni) --- */
  --murekkeb:#0b0b0c;
  --kagiz:#fbfaf8;
  --sus:#86868b;
  --xett:rgba(11,11,12,.13);
  --dsp:"Latino","Boruna","Poppins",serif;
  --metn:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --kenar:clamp(20px,5vw,88px);
  --yum:cubic-bezier(.22,.61,.36,1);

  /* --- kampaniya qatı --- */
  --autumn:#B4531F;
  --sale:#C0342B;
  --autumn-soft:rgba(180,83,31,.08);
  --acilma:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--kagiz);color:var(--murekkeb);font-family:var(--metn);font-weight:300;
  font-size:clamp(15px,1.05vw,17px);line-height:1.6;-webkit-font-smoothing:antialiased
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--autumn);outline-offset:3px}

.kicik{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--sus)}
.blok{padding:clamp(72px,12vh,168px) var(--kenar)}
h2{font-family:var(--dsp);font-weight:400;font-size:clamp(30px,5.2vw,72px);line-height:1.02;letter-spacing:-.01em}

/* nümunə lenti — əsas sayta köçürüləndə silinir */
.numune{
  padding:11px var(--kenar);border-bottom:1px solid var(--xett);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sus)
}
.numune a{color:var(--autumn)}

/* ==================== BÖLMƏ ==================== */
#paketler{position:relative;overflow:hidden}
#paketler > *{position:relative;z-index:1}

/* --- payız yarpaqları (fon) --- */
.yarpaqlar{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.yarpaq{
  position:absolute;top:-14%;width:34px;height:42px;
  color:var(--autumn);filter:blur(1px);
  animation-name:yarpaqDus;animation-timing-function:linear;animation-iteration-count:infinite
}
.yarpaq svg{width:100%;height:100%;display:block;fill:currentColor}
@keyframes yarpaqDus{
  0%  {transform:translate3d(0,-20vh,0) rotate(0deg)}
  100%{transform:translate3d(var(--sur,20px),118vh,0) rotate(var(--don,320deg))}
}

/* --- kampaniya nişanı --- */
.kampaniya-pill{
  display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--autumn-soft);color:var(--autumn);
  padding:10px 18px;border-radius:100px;border:1px solid rgba(180,83,31,.18);
  font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase
}
.kampaniya-pill i{width:6px;height:6px;border-radius:50%;background:var(--sale);flex:none;
  box-shadow:0 0 0 0 rgba(192,52,43,.5);animation:pillNebz 2.2s ease-out infinite}
@keyframes pillNebz{
  0%{box-shadow:0 0 0 0 rgba(192,52,43,.45)}
  70%{box-shadow:0 0 0 9px rgba(192,52,43,0)}
  100%{box-shadow:0 0 0 0 rgba(192,52,43,0)}
}
.kampaniya-pill b{font-weight:400;color:var(--sale)}

/* ==================== REJİM DÜYMƏSİ ==================== */
.rejim{display:inline-flex;border:1px solid var(--xett);border-radius:100px;padding:4px;position:relative;margin-top:26px}
.rejim button{
  position:relative;z-index:2;color:var(--sus);font-size:12.5px;padding:9px 18px;border-radius:100px;
  transition:color .4s var(--yum)
}
.rejim button.aktiv{color:var(--kagiz)}
.rejim .surgu{
  position:absolute;top:4px;left:4px;height:calc(100% - 8px);
  background:var(--murekkeb);border-radius:100px;
  transition:transform .55s cubic-bezier(.34,1.4,.5,1),width .55s cubic-bezier(.34,1.4,.5,1)
}

/* ==================== KARTLAR ==================== */
.paketler{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));
  gap:clamp(12px,1.6vw,20px);margin-top:clamp(28px,5vh,48px)
}
.paket{
  position:relative;border:1px solid var(--xett);border-radius:18px;
  padding:clamp(22px,2.4vw,30px);display:flex;flex-direction:column;background:var(--kagiz);
  transition:transform .3s var(--yum),box-shadow .3s var(--yum),border-color .3s var(--yum),opacity .6s var(--acilma)
}
.paket:hover{transform:translateY(-4px);border-color:var(--autumn);box-shadow:0 18px 50px rgba(11,11,12,.07)}
.paket.esas{border-color:var(--autumn)}

/* giriş animasiyası */
.paket{opacity:0;transform:translateY(16px)}
.paket.gor{opacity:1;transform:none;transition:opacity .6s var(--acilma),transform .6s var(--acilma),border-color .3s var(--yum),box-shadow .3s var(--yum)}
.paket.gor:hover{transform:translateY(-4px)}
/* kart görünəndə üzərindən bir dəfə işıq keçir */
.paket::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:linear-gradient(105deg,transparent 36%,rgba(180,83,31,.13) 50%,transparent 64%);
  transform:translateX(-125%);opacity:0
}
.paket.parla::after{animation:kartParla 1.2s var(--acilma) forwards}
@keyframes kartParla{
  0%{transform:translateX(-125%);opacity:1}
  100%{transform:translateX(125%);opacity:0}
}

/* "ən çox seçilən" etiketi */
.esas-etiket{
  position:absolute;top:0;left:clamp(22px,2.4vw,30px);transform:translateY(-50%);
  background:var(--kagiz);color:var(--autumn);padding:0 10px;
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap
}

/* endirim nişanı */
.endirim{
  position:absolute;top:clamp(14px,1.6vw,18px);right:clamp(14px,1.6vw,18px);
  display:inline-flex;align-items:center;justify-content:center;overflow:hidden;
  min-width:64px;padding:9px 14px;border-radius:100px;
  background:var(--sale);color:#fff;
  font-family:var(--mono);font-size:13px;letter-spacing:.02em;
  box-shadow:0 8px 22px -8px rgba(192,52,43,.55);
  opacity:0;transform:scale(.8) rotate(-6deg)
}
.endirim.gel{
  opacity:1;transform:scale(1) rotate(0deg);
  transition:opacity .4s var(--acilma),transform .45s cubic-bezier(.34,1.5,.5,1)
}
/* nişanın üzərindən keçən parıltı */
.endirim::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%);
  transform:translateX(-130%)
}
.endirim.gel::after{animation:nisanParla 1.15s .45s var(--acilma)}
@keyframes nisanParla{to{transform:translateX(130%)}}
.endirim.nebz{animation:endirimNebz 2.5s ease-in-out infinite}
@keyframes endirimNebz{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

.paket .kicik{padding-right:64px}
.paket h3{font-family:var(--dsp);font-weight:400;font-size:clamp(22px,2.6vw,30px);margin:14px 0 6px}
.paket .qisa{color:var(--sus);font-size:13.5px;min-height:2.8em}

/* ==================== QİYMƏT ==================== */
.qiymet-blok{
  margin-top:18px;
  transition:opacity .35s var(--yum),transform .35s var(--yum)
}
.qiymet-blok.cixir{opacity:0;transform:translateY(-6px)}

/* köhnə qiymət — yeni qiymətin ÜSTÜNDƏ, sabit hündürlükdə (layout sıçramır) */
.kohne{
  display:block;height:26px;line-height:26px;
  font-size:17px;color:var(--sus);text-decoration:none;position:relative;width:fit-content
}
.kohne::after{
  content:"";position:absolute;left:-2px;right:-2px;top:52%;height:2px;
  background:var(--sale);border-radius:2px;
  transform:scaleX(0);transform-origin:left;
  transition:transform .45s var(--acilma)
}
.kohne.cizildi::after{transform:scaleX(1)}

/* qənaət sətri — endirimin manatla qarşılığı */
.qenaet{
  display:inline-flex;align-items:center;gap:7px;margin-top:10px;
  padding:6px 12px;border-radius:100px;
  background:rgba(192,52,43,.09);color:var(--sale);
  font-size:12.5px;white-space:nowrap;
  opacity:0;transform:translateY(6px);
  transition:opacity .45s var(--acilma),transform .45s var(--acilma)
}
.qenaet.gel{opacity:1;transform:none}
.qenaet b{font-weight:500;font-variant-numeric:tabular-nums}

/* qiymət düşüb oturanda yüngül vurğu */
.qiymet strong{display:inline-block;transition:transform .35s var(--acilma)}
.qiymet strong.dusdu{animation:qiymetOtur .45s var(--acilma)}
@keyframes qiymetOtur{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}

.qiymet{display:flex;align-items:baseline;gap:4px;margin-top:4px;font-family:var(--dsp);font-size:clamp(30px,3.4vw,40px);line-height:1}
.qiymet strong{font-weight:400;font-variant-numeric:tabular-nums}
.qiymet .val{font-family:var(--metn);font-weight:400;font-size:.5em}
.qiymet .vahid{font-family:var(--metn);font-weight:300;font-size:12px;color:var(--sus);margin-left:4px}

.paket ul{list-style:none;margin-top:20px;padding-top:18px;border-top:1px solid var(--xett)}
.paket li{font-size:13.5px;color:var(--sus);padding:5px 0;display:flex;gap:9px}
.paket li::before{content:"—";color:var(--murekkeb);opacity:.35;flex:none}

.dgm{
  margin-top:22px;text-align:center;
  font-size:13px;font-weight:400;padding:12px 22px;border-radius:100px;border:1px solid var(--xett);
  transition:background .35s var(--yum),color .35s var(--yum),border-color .35s var(--yum),transform .35s var(--yum)
}
.dgm:hover{transform:translateY(-2px)}
.dgm.dolu{background:var(--murekkeb);color:var(--kagiz);border-color:var(--murekkeb)}
.dgm.dolu:hover{opacity:.86}
.dgm.bos:hover{background:rgba(11,11,12,.05)}
.paket .dgm{margin-top:auto}
.paket ul{margin-bottom:22px}

/* ==================== GERİ SAYIM ==================== */
.sayim{
  margin-top:clamp(24px,3.5vh,36px);display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  font-size:13.5px;color:var(--autumn)
}
.sayim-bas{color:var(--sus)}
.sayim-bas b{font-weight:400;color:var(--autumn)}
.sayim-qutular{display:inline-flex;gap:7px}
.sayim-qutular i{
  display:inline-flex;flex-direction:column;align-items:center;gap:2px;
  min-width:52px;padding:7px 8px;border-radius:10px;
  background:var(--autumn-soft);border:1px solid rgba(180,83,31,.16);font-style:normal
}
.sayim-qutular u{
  text-decoration:none;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--sus)
}
.sayim-qutular b{
  font-family:var(--mono);font-size:16px;font-weight:400;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--autumn)
}

/* ==================== MOBİL ==================== */
@media (max-width:820px){
  .yarpaqlar{display:none}                    /* performans: mobildə yarpaq yoxdur */
  .paketler{grid-template-columns:minmax(0,1fr)}
  .endirim{min-width:58px;padding:8px 12px;font-size:12px}
  .paket .kicik{padding-right:76px}
  .kohne{font-size:16px}
  .sayim-qutular i{min-width:46px}
  .qiymet{font-size:32px}
}

/* ==================== HƏRƏKƏT AZALDILIB ==================== */
@media (prefers-reduced-motion:reduce){
  .yarpaqlar{display:none}
  .paket{opacity:1 !important;transform:none !important;transition:none !important}
  .paket:hover{transform:none !important}
  .kohne::after{transform:scaleX(1) !important;transition:none !important}
  .endirim{opacity:1 !important;transform:none !important;animation:none !important;transition:none !important}
  .qiymet-blok{transition:none !important}
  .rejim .surgu{transition:none !important}
  .qenaet{opacity:1 !important;transform:none !important;transition:none !important}
  .paket::after,.endirim::after{display:none !important}
  .kampaniya-pill i{animation:none !important}
  .qiymet strong{animation:none !important}
}
</style>
</head>
<body>

<div class="numune">
  <span>Nümunə · Paketlər bölməsi — payız kampaniyası</span>
  <a href="/?web=1">əsas sayta qayıt &rarr;</a>
</div>

<!-- ================= PAKETLƏR ================= -->
<section class="blok" id="paketler" aria-labelledby="p-bas">
  <div class="yarpaqlar" id="yarpaqlar" aria-hidden="true"></div>

  <div class="kampaniya-pill"><i aria-hidden="true"></i>Payız kampaniyası<b id="pill-endirim">&mdash;</b></div>
  <div class="kicik" style="margin-top:18px">Paketlər</div>
  <h2 id="p-bas" style="margin-top:12px">Video + foto</h2>

  <div class="rejim" role="tablist" aria-label="Ödəniş rejimi">
    <div class="surgu" id="surgu" aria-hidden="true"></div>
    <button type="button" class="aktiv" role="tab" aria-selected="true">Tək layihə</button>
    <button type="button" role="tab" aria-selected="false">Aylıq</button>
  </div>

  <div class="paketler" id="paketler-tor"></div>

  <p class="sayim" id="sayim">
    <span class="sayim-bas" id="sayim-mtn">Kampaniya <b>30 sentyabra</b> qədər</span>
    <span class="sayim-qutular" id="sayim-qutular" aria-live="off"></span>
  </p>
</section>

<script>
(function(){
'use strict';

/* ==========================================================================
   KONFİQ — bütün qiymət, mətn və tarixlər YALNIZ burada.
   Kampaniyanı dəyişmək üçün başqa heç bir yerə toxunmaq lazım deyil.
   ========================================================================== */
var KAMPANIYA = {
  bitis: "2026-09-30T23:59:59+04:00",   /* Bakı vaxtı */
  bitisMetni: "Kampaniya 30 sentyabra qədər"
};

var PACKAGES = {
  single: [
    { nisan:"Super 8", ad:"Reels Start", qisa:"Sosial media üçün sürətli kontent.",
      kohne:350, yeni:250, endirim:29, vahid:"/ layihə", esas:false,
      siyahi:["2–3 saat çəkiliş","2 Reels","Montaj + subtitr","Color correction"] },

    { nisan:"16 mm", ad:"Brand Content", qisa:"Reklam çarxı və ya brend filmi.",
      kohne:550, yeni:390, endirim:29, vahid:"/ layihə", esas:true,
      siyahi:["Yarım gün çəkiliş","1 əsas reklam videosu","2 qısa Reels","Sound design + color grading"] },

    { nisan:"35 mm", ad:"Full Content Day", qisa:"Tam gün, geniş çeşid material.",
      kohne:850, yeni:590, endirim:31, vahid:"/ layihə", esas:false,
      siyahi:["Tam gün çəkiliş","1 əsas video","3–4 qısa sosial media videosu","Motion graphics","Sound design","3 revision raundu"] }
  ],
  monthly: [
    { nisan:"Super 8", ad:"Reels Start", qisa:"Aylıq davamlı Reels axını.",
      kohne:690, yeni:490, endirim:29, vahid:"/ ayda", esas:false,
      siyahi:["Ayda 2 çəkiliş (2–3 saat)","6 Reels","Montaj + subtitr","Color correction","Aylıq kontent planı"] },

    { nisan:"16 mm", ad:"Brand Content", qisa:"Aylıq reklam və brend kontenti.",
      kohne:1100, yeni:780, endirim:29, vahid:"/ ayda", esas:true,
      siyahi:["Ayda 2 yarım gün çəkiliş","2 əsas reklam videosu","4 qısa Reels","Sound design + color grading","2 revision raundu"] },

    { nisan:"35 mm", ad:"Full Content Day", qisa:"Ən geniş aylıq kontent paketi.",
      kohne:1700, yeni:1180, endirim:31, vahid:"/ ayda", esas:false,
      siyahi:["Ayda 1 tam gün + 1 yarım gün çəkiliş","3 əsas video","6–8 qısa sosial media videosu","Motion graphics","Sound design","3 revision raundu","Prioritet təhvil (48 saat)"] }
  ]
};

/* ========================================================================== */
var azalt = matchMedia('(prefers-reduced-motion: reduce)').matches;
var tor = document.getElementById('paketler-tor');
var rejimBtn = [].slice.call(document.querySelectorAll('.rejim button'));
var surgu = document.getElementById('surgu');
var cari = 0;                 /* 0 = tək layihə, 1 = aylıq */
var acilib = false;           /* bölmə bir dəfə görünübmü */

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------------- KARTLARI QUR ---------------- */
function kartlariQur(rejim){
  var siyahi = rejim === 1 ? PACKAGES.monthly : PACKAGES.single;
  tor.innerHTML = siyahi.map(function(p, i){
    return '' +
    '<article class="paket' + (p.esas ? ' esas' : '') + '" data-i="' + i + '">' +
      (p.esas ? '<span class="esas-etiket">Ən çox seçilən</span>' : '') +
      '<span class="endirim" role="img" aria-label="' + p.endirim + ' faiz endirim">&minus;' + p.endirim + '%</span>' +
      '<div class="kicik">' + esc(p.nisan) + '</div>' +
      '<h3>' + esc(p.ad) + '</h3>' +
      '<p class="qisa">' + esc(p.qisa) + '</p>' +
      '<div class="qiymet-blok">' +
        '<s class="kohne">' + p.kohne + ' ₼</s>' +
        '<div class="qiymet">' +
          '<strong data-bas="' + p.kohne + '" data-hedef="' + p.yeni + '">' + p.kohne + '</strong>' +
          '<span class="val">₼</span>' +
          '<span class="vahid">' + esc(p.vahid) + '</span>' +
        '</div>' +
        '<span class="qenaet"><b>' + (p.kohne - p.yeni) + ' ₼</b> qənaət edirsən</span>' +
      '</div>' +
      '<ul>' + p.siyahi.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>' +
      '<a class="dgm ' + (p.esas ? 'dolu' : 'bos') + '" href="/#elaqe">Seç</a>' +
    '</article>';
  }).join('');
}

/* ---------------- RƏQƏM SAYIMI ---------------- */
/* Qiymət KÖHNƏDƏN YENİYƏ enir — endirimin ən aydın göstəricisi budur:
   istifadəçi rəqəmin düşdüyünü gözü ilə görür. */
function sayimAnimasiya(el, basDeyer, hedef, muddet, bitdi){
  if(azalt){ el.textContent = hedef; if(bitdi) bitdi(); return; }
  var t0 = null;
  el.textContent = basDeyer;
  function addim(t){
    if(t0 === null) t0 = t;
    var n = Math.min(1, (t - t0) / muddet);
    var e = 1 - Math.pow(1 - n, 3);                 /* ease-out cubic */
    el.textContent = Math.round(basDeyer + (hedef - basDeyer) * e);
    if(n < 1) requestAnimationFrame(addim);
    else {
      el.textContent = hedef;
      el.classList.add('dusdu');
      setTimeout(function(){ el.classList.remove('dusdu'); }, 500);
      if(bitdi) bitdi();
    }
  }
  requestAnimationFrame(addim);
}

/* ---------------- BİR KARTIN ARDICILLIĞI ---------------- */
function kartOynat(kart, gecikme){
  var kohne  = kart.querySelector('.kohne');
  var reqem  = kart.querySelector('.qiymet strong');
  var nisan  = kart.querySelector('.endirim');
  var qenaet = kart.querySelector('.qenaet');
  var hedef  = parseInt(reqem.getAttribute('data-hedef'), 10) || 0;
  var basDeyer = parseInt(reqem.getAttribute('data-bas'), 10) || hedef;

  if(azalt){
    kart.classList.add('gor');
    kohne.classList.add('cizildi');
    reqem.textContent = hedef;
    nisan.classList.add('gel');
    if(qenaet) qenaet.classList.add('gel');
    return;
  }

  setTimeout(function(){ kart.classList.add('gor', 'parla'); }, gecikme);
  setTimeout(function(){ kohne.classList.add('cizildi'); }, gecikme + 300);
  setTimeout(function(){
    sayimAnimasiya(reqem, basDeyer, hedef, 900, function(){
      nisan.classList.add('gel');
      if(qenaet) qenaet.classList.add('gel');
      setTimeout(function(){ nisan.classList.add('nebz'); }, 500);
    });
  }, gecikme + 320);
}

function hamisiniOynat(){
  [].slice.call(tor.children).forEach(function(kart, i){
    kartOynat(kart, i * 60);                       /* 60ms fərq */
  });
}

/* ---------------- REJİM DƏYİŞMƏSİ ---------------- */
function surguYer(i){
  var b = rejimBtn[i]; if(!b || !surgu) return;
  surgu.style.width = b.offsetWidth + 'px';
  surgu.style.transform = 'translateX(' + (b.offsetLeft - 4) + 'px)';
}

function rejimQoy(i, ilk){
  cari = i;
  rejimBtn.forEach(function(b, j){
    b.classList.toggle('aktiv', j === i);
    b.setAttribute('aria-selected', j === i ? 'true' : 'false');
  });
  surguYer(i);

  if(ilk || azalt){
    kartlariQur(i);
    if(!ilk || acilib) hamisiniOynat();
    return;
  }

  /* köhnə qiymət bloku çıxsın → yenisi gəlsin */
  var bloklar = [].slice.call(tor.querySelectorAll('.qiymet-blok'));
  bloklar.forEach(function(b){ b.classList.add('cixir'); });
  setTimeout(function(){
    kartlariQur(i);
    [].slice.call(tor.children).forEach(function(k){ k.classList.add('gor'); });
    hamisiniOynatQiymet();
  }, 350);
}

/* rejim dəyişəndə kartlar yenidən görünmür — yalnız qiymət hissəsi oynayır */
function hamisiniOynatQiymet(){
  [].slice.call(tor.children).forEach(function(kart, i){
    var kohne  = kart.querySelector('.kohne');
    var reqem  = kart.querySelector('.qiymet strong');
    var nisan  = kart.querySelector('.endirim');
    var qenaet = kart.querySelector('.qenaet');
    var hedef  = parseInt(reqem.getAttribute('data-hedef'), 10) || 0;
    var basDeyer = parseInt(reqem.getAttribute('data-bas'), 10) || hedef;
    var g = i * 60;
    if(azalt){
      kohne.classList.add('cizildi'); reqem.textContent = hedef;
      nisan.classList.add('gel'); if(qenaet) qenaet.classList.add('gel');
      return;
    }
    setTimeout(function(){ kohne.classList.add('cizildi'); }, g + 60);
    setTimeout(function(){
      sayimAnimasiya(reqem, basDeyer, hedef, 900, function(){
        nisan.classList.add('gel');
        if(qenaet) qenaet.classList.add('gel');
        setTimeout(function(){ nisan.classList.add('nebz'); }, 500);
      });
    }, g + 60);
  });
}

/* ---------------- GERİ SAYIM ---------------- */
function sayimYenile(){
  var q = document.getElementById('sayim-qutular');
  if(!q) return;
  var qalan = new Date(KAMPANIYA.bitis).getTime() - Date.now();
  if(isNaN(qalan)){ q.innerHTML = ''; return; }
  if(qalan <= 0){ q.innerHTML = '<i><b>0</b><u>bitdi</u></i>'; return; }
  var dq = Math.floor(qalan / 60000);
  var gun = Math.floor(dq / 1440), saat = Math.floor((dq % 1440) / 60), deq = dq % 60;
  function ik(n){ return n < 10 ? '0' + n : '' + n; }
  q.innerHTML =
    '<i><b>' + ik(gun)  + '</b><u>gün</u></i>' +
    '<i><b>' + ik(saat) + '</b><u>saat</u></i>' +
    '<i><b>' + ik(deq)  + '</b><u>dəq</u></i>';
}

/* ən böyük endirim faizi — kampaniya nişanında göstərilir */
function pillEndirim(){
  var el = document.getElementById('pill-endirim');
  if(!el) return;
  var en = 0;
  PACKAGES.single.concat(PACKAGES.monthly).forEach(function(p){ if(p.endirim > en) en = p.endirim; });
  el.textContent = '· ' + en + '%-ə qədər endirim';
}

/* ---------------- YARPAQLAR ---------------- */
function yarpaqlariQur(){
  var q = document.getElementById('yarpaqlar');
  /* mobildə CSS onsuz da display:none edir — burada yalnız hərəkət
     azaldılıbsa dayanırıq ki, ekran sonradan genişlənsə yarpaqlar olsun */
  if(!q || azalt) return;
  var YARPAQ = '<svg viewBox="0 0 32 40" aria-hidden="true">' +
    '<path d="M16 1.5C7.8 8.6 2.5 15.2 2.5 22.6c0 7.6 6 13.9 13.5 15.9 7.5-2 13.5-8.3 13.5-15.9C29.5 15.2 24.2 8.6 16 1.5z"/>' +
    '<path d="M15.4 12h1.2v26h-1.2z" opacity=".55"/></svg>';
  /* 6 yarpaq — az saxlanılıb, çox olsa ucuz görünür */
  var yer = [
    {l:8,  en:30, sure:26, gec:0,   sur:'26px',  don:'300deg', op:.09},
    {l:26, en:22, sure:31, gec:-9,  sur:'-18px', don:'-260deg',op:.06},
    {l:47, en:36, sure:22, gec:-4,  sur:'34px',  don:'340deg', op:.10},
    {l:63, en:24, sure:29, gec:-15, sur:'-24px', don:'280deg', op:.07},
    {l:81, en:32, sure:19, gec:-7,  sur:'20px',  don:'-320deg',op:.08},
    {l:93, en:20, sure:24, gec:-18, sur:'-14px', don:'300deg', op:.06}
  ];
  q.innerHTML = yer.map(function(y){
    return '<span class="yarpaq" style="' +
      'left:' + y.l + '%;width:' + y.en + 'px;height:' + Math.round(y.en * 1.25) + 'px;' +
      'opacity:' + y.op + ';animation-duration:' + y.sure + 's;animation-delay:' + y.gec + 's;' +
      '--sur:' + y.sur + ';--don:' + y.don + '">' + YARPAQ + '</span>';
  }).join('');
}

/* ---------------- BAŞLAT ---------------- */
function basla(){
  kartlariQur(0);
  rejimBtn.forEach(function(b, i){ b.addEventListener('click', function(){ if(i !== cari) rejimQoy(i); }); });
  surguYer(0);
  addEventListener('resize', function(){ surguYer(cari); });
  yarpaqlariQur();
  pillEndirim();
  sayimYenile();
  setInterval(sayimYenile, 30000);

  if(azalt || !('IntersectionObserver' in window)){
    acilib = true; hamisiniOynat(); return;
  }
  var io = new IntersectionObserver(function(g){
    if(g[0].isIntersecting && !acilib){
      acilib = true;
      hamisiniOynat();
      io.disconnect();
    }
  }, {threshold:.15, rootMargin:'0px 0px -6% 0px'});
  io.observe(tor);

  /* ehtiyat: müşahidəçi işə düşməsə də kartlar gizli qalmasın */
  setTimeout(function(){ if(!acilib){ acilib = true; hamisiniOynat(); } }, 4000);
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', basla);
else basla();
})();
</script>
